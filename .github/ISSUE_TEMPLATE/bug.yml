name: Bug
description: Algo não funciona como deveria
labels: ["tipo:bug"]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: input
    id: versoes
    attributes:
      label: Versões dos motores (rodapé do app ou /saude)
      placeholder: "RR 1.7.2 / SN 1.0.2"
