# Atualizações de dependências.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencias]

  # Backend Python (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencias]

  # Frontend (frontend/package.json + package-lock.json). O cooldown espera 7 dias depois de cada
  # versão nova, como o min-release-age do frontend/.npmrc; não vale para as atualizações de segurança.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencias]

  # Imagens base dos motores (eclipse-temurin). A versão dos motores da Receita é fixada
  # por tag + SHA nos Dockerfiles e só muda em PR próprio com make golden verde (P5).
  - package-ecosystem: docker
    directory: /motores/regime-regular
    schedule:
      interval: weekly
    labels: [dependencias]

  - package-ecosystem: docker
    directory: /motores/simples-nacional
    schedule:
      interval: weekly
    labels: [dependencias]
