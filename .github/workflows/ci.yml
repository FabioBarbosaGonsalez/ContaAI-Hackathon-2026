name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versões fixadas das ferramentas do CI (todas gratuitas e de código aberto).
env:
  UV_VERSAO: "0.12.20"
  PIP_AUDIT_VERSAO: "2.10.1"
  GITLEAKS_VERSAO: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  python:
    name: Python (lint, tipos, testes e cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # uv (MIT OR Apache-2.0) instala exatamente o que está no backend/uv.lock (--locked falha se o lock
      # estiver desatualizado). Fixado na versão usada no desenvolvimento.
      - name: Instalar uv e as dependências travadas
        run: |
          pip install "uv==${UV_VERSAO}"
          uv sync --locked --all-extras --project backend
      - name: Lint e formatação (ruff)
        run: |
          uv run --project backend ruff check .
          uv run --project backend ruff format --check .
      - name: Tipos (mypy)
        working-directory: backend
        run: uv run mypy
      - name: Testes e cobertura (mínimo de 90% no app)
        working-directory: backend
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report

  auditoria:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pip-audit (PyPA, Apache-2.0) confere as versões travadas no banco de vulnerabilidades do PyPI.
      # Sem conta nem chave. --require-hashes: audita exatamente os arquivos do lock.
      - name: Auditar o uv.lock
        working-directory: backend
        run: |
          pip install "uv==${UV_VERSAO}"
          uv export --locked --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uvx "pip-audit==${PIP_AUDIT_VERSAO}" -r "$RUNNER_TEMP/req.txt" --require-hashes --disable-pip --strict

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # o histórico inteiro, não só o último commit
      # O binário do gitleaks (MIT), baixado da release oficial e conferido pelo SHA-256 publicado nela.
      # Não usamos a gitleaks-action: desde a v2 ela não é mais MIT. A varredura de segredos e a proteção
      # no push do próprio GitHub também estão ligadas no repositório (gratuitas em repositório público).
      - name: Instalar o gitleaks
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$arquivo"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/$arquivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" gitleaks
      - name: Varrer o histórico
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose

  frontend:
    name: Frontend (lint, tipos, testes, build e dependências)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node 24 (LTS). O frontend/package.json exige ^24.15.0 (engines, com engine-strict no .npmrc).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci instala exatamente o package-lock.json (falha se ele divergir do package.json)
      # e, pelo frontend/.npmrc, sem rodar scripts de instalação de terceiros.
      - name: Instalar as dependências travadas
        run: npm ci
      # npm audit confere o lock no banco de vulnerabilidades do registro público do npm (sem conta
      # nem chave); falha em qualquer severidade. audit signatures confere a assinatura do registro
      # de cada pacote instalado.
      - name: Dependências (npm audit)
        run: |
          npm audit --audit-level=low
          npm audit signatures
      # Os tipos da tela são gerados de docs/contrato/openapi.json; falha se ficarem para trás do contrato.
      - name: Contrato (tipos gerados em dia)
        run: npm run contrato:checar
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npx vite build
      # Segunda barreira, depois do lint: busca no código e confere o build publicado (CSP no <meta>, sem
      # script ou estilo embutido, sem mapa de código, sem endereço de terceiro). docs/seguranca.md.
      - name: Segurança da tela
        run: npm run seguranca

  compose:
    name: Docker Compose (validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar docker-compose.yml
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose config --quiet

  # Job agregador: é o único check exigido pela proteção da main.
  ci-ok:
    name: CI
    if: always()
    needs: [python, auditoria, segredos, frontend, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
