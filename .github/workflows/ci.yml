name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Testes do backend
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest -q

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
      - name: Instalar, lint, testes e build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test --if-present
          npm run build

  compose:
    name: Docker Compose (validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar docker-compose.yml
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose config --quiet

  # Job agregador: é o único check exigido pela proteção da main.
  ci-ok:
    name: CI
    if: always()
    needs: [python, frontend, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
