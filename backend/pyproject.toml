[project]
name = "contaai-backend"
version = "0.1.0"
description = "Backend do ContaAI: orquestra os motores oficiais da Receita (RTC), preço-alvo, regimes, NF-e e alertas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A pasta backend/ no caminho de importação: os testes importam app.* e tests.apoio_* sem depender
# da instalação editável.
pythonpath = ["."]
# Os testes "golden" falam com os motores rodando (docker compose up). Ficam fora do
# pytest padrão (e do CI) e rodam com: make golden  ou  uv run pytest -m golden
# Os testes "llm" chamam o provedor de IA de verdade e gastam crédito: uv run pytest -m llm
addopts = "-m 'not golden and not llm' --strict-markers"
markers = [
    "golden: testes de referência contra os motores oficiais em execução (exigem docker compose up)",
    "llm: perguntas ao provedor de IA configurado no backend/.env (GASTAM crédito; rodar à mão)",
]

[tool.mypy]
# Checagem de tipos do app (o CI roda `uv run mypy`). O plugin do Pydantic confere os argumentos dos modelos.
files = ["app"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
# Cobertura de linhas do app pelos testes do CI (sem os golden e os llm). Mínimo combinado: 90%.
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
